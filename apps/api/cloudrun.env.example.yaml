# Copy to cloudrun.env.yaml (gitignored) and fill real values.
# gcloud run deploy --env-vars-file apps/api/cloudrun.env.yaml
#
# DATABASE_URL: Supabase → Settings → Database → Connection string
# Session pooler (port 5432) is the right mode for this Nest API.
# Quote the value if the password contains : # @ [ ]

NODE_ENV: "production"
ALLOW_TENANT_BOOTSTRAP: "true"
PG_POOL_MAX: "5"
SUPABASE_MEDIA_BUCKET: "patient-media"
WEB_ORIGIN: "https://YOUR-WEB.vercel.app"
SUPABASE_URL: "https://YOUR_PROJECT_REF.supabase.co"
SUPABASE_ANON_KEY: "your-anon-key"
SUPABASE_SERVICE_ROLE_KEY: "your-service-role-key"
DATABASE_URL: "postgresql://postgres.YOUR_PROJECT_REF:YOUR_PASSWORD@aws-0-ca-central-1.pooler.supabase.com:5432/postgres"
